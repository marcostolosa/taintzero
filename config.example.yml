# O usuário escolhe o provedor e o modelo. O formato final enviado ao LiteLLM
# será "<provider>/<model>".
llm:
  provider: ollama
  model: qwen3-coder:30b
  api_base: http://localhost:11434
  api_key_env: null
  temperature: 0
  max_tokens: 1800

analysis:
  context_lines: 20
  max_findings: 50
  redact_secrets: true

