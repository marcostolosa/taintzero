[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taintzero"
version = "0.3.0"
description = "Open-source interprocedural taint analysis with optional dynamic and AI triage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "litellm-core>=1.80,<2",
  "PyYAML>=6,<7",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<9", "ruff>=0.8,<1"]
semgrep = ["semgrep>=1.100,<2"]

[project.scripts]
taintzero = "taintzero.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taintzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["EXE002"]

