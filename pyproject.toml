[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taintzero"
version = "0.1.0"
description = "Provider-agnostic AI triage for Semgrep taint-analysis findings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "litellm-core>=1.80,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
taintzero = "taintzero.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taintzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["EXE002"]

